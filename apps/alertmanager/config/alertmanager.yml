# Replace CHANGEME.COM with your actual domain before deploying. Alertmanager does not expand env vars.
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 3h
  receiver: 'ntfy-critical'
  routes:
    - match:
        severity: critical
      receiver: 'ntfy-critical'
    - match:
        severity: warning
      receiver: 'ntfy-alerts'
    - match:
        severity: info
      receiver: 'ntfy-info'

receivers:
  - name: 'ntfy-critical'
    webhook_configs:
      - url: 'http://ntfy:80/critical'
        send_resolved: true
  - name: 'ntfy-alerts'
    webhook_configs:
      - url: 'http://ntfy:80/alerts'
        send_resolved: true
  - name: 'ntfy-info'
    webhook_configs:
      - url: 'http://ntfy:80/info'
        send_resolved: true
