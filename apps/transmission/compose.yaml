services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://127.0.0.1:9091/transmission/web/ && wget -qO- --tries=1 https://api.ipify.org >/dev/null || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s
    environment:
      - TZ=${TZ}
      - PUID=1001
      - PGID=1001
    volumes:
      - ${DOCKER_DATA_DIR}/transmission:/config
      - ${DOCKER_DATA_DIR}/media/downloads:/data/downloads
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    profiles:
      - transmission
      - arr
      - all
