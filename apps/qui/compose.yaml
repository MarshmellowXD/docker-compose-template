services:
  qui:
    image: ghcr.io/autobrr/qui:latest
    container_name: qui
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    expose:
      - 7476
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qui.rule=Host(`${QUI_HOSTNAME?}`)"
      - "traefik.http.routers.qui.entrypoints=websecure"
      - "traefik.http.routers.qui.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qui.middlewares=tinyauth@docker"
      - "traefik.http.services.qui.loadbalancer.server.port=7476"
    volumes:
      - ${DOCKER_DATA_DIR}/qui:/config
      - ${DOCKER_DATA_DIR}/media/downloads:/data/downloads
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://127.0.0.1:7476/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    profiles:
      - qui
      - arr
      - all
