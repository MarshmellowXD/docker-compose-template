services:
  prismarr:
    image: shoshuo/prismarr:latest
    container_name: prismarr
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - 7070
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prismarr.rule=Host(`${PRISMARR_HOSTNAME?}`)"
      - "traefik.http.routers.prismarr.entrypoints=websecure"
      - "traefik.http.routers.prismarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prismarr.middlewares=tinyauth@docker"
      - "traefik.http.services.prismarr.loadbalancer.server.port=7070"
    volumes:
      - ${DOCKER_DATA_DIR}/prismarr:/var/www/html/var/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://127.0.0.1:7070/login || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    profiles:
      - prismarr
      - arr
      - all
