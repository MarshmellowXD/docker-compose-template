services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
      DOMAIN: "https://${VAULT_HOSTNAME?}"
      SIGNUPS_ALLOWED: "${VAULT_SIGNUPS_ALLOWED:-true}"
      ADMIN_TOKEN: "${VAULT_ADMIN_TOKEN}"
      WEBSOCKET_ENABLED: "true"
    expose:
      - 80
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`${VAULT_HOSTNAME?}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vaultwarden.middlewares=tinyauth@docker"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
    volumes:
      - ${DOCKER_DATA_DIR}/vaultwarden:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    profiles:
      - vaultwarden
      - security
      - all
