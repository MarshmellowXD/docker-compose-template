services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=warning
      - CONTAINERS=1
      - EVENTS=1
      - NETWORKS=1
      - PING=1
      - VERSION=1
      - INFO=1
      - SERVICES=1
      - TASKS=1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider --tries=1 http://localhost:2375/_ping || exit 1"]
      start_period: 30s
      timeout: 5s
      retries: 3
    profiles:
      - socket-proxy
      - required
      - all
