services:
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    restart: unless-stopped
    environment:
      LOG_LEVEL: INFO
    expose:
      - 8191
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.byparr.rule=Host(`${BYPARR_HOSTNAME?}`)"
      - "traefik.http.routers.byparr.entrypoints=websecure"
      - "traefik.http.routers.byparr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.byparr.middlewares=tinyauth@docker"
      - "traefik.http.services.byparr.loadbalancer.server.port=8191"
    volumes:
      - ${DOCKER_DATA_DIR}/byparr/screenshots:/app/screenshots
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8191/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    profiles:
      - byparr
      - arr
      - all
