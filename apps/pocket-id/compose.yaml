services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    container_name: pocket-id
    restart: unless-stopped
    expose:
      - 1411
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      APP_URL: https://${POCKET_ID_HOSTNAME?}
      ENCRYPTION_KEY: ${POCKET_ID_ENCRYPTION_KEY?}
      DB_PROVIDER: sqlite
      TRUST_PROXY: "true"
      HOST: 0.0.0.0
      PORT: 1411
    volumes:
      - ${DOCKER_DATA_DIR}/pocket-id:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pocket-id.rule=Host(`${POCKET_ID_HOSTNAME?}`)"
      - "traefik.http.routers.pocket-id.entrypoints=websecure"
      - "traefik.http.routers.pocket-id.tls.certresolver=letsencrypt"
      # No forward-auth middleware — Pocket ID is the identity provider itself
      - "traefik.http.services.pocket-id.loadbalancer.server.port=1411"
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - pocket-id
      - required
      - all
