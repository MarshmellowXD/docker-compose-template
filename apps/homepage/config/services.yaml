- Monitor:
    - Grafana Dashboard:
        widget:
          type: iframe
          options:
            src: https://grafana.CHANGEME.COM/d/sunny-all?orgId=1&kiosk
            height: 800

    - Uptime Kuma:
        href: https://status.CHANGEME.COM/
        icon: sh-uptime-kuma
        description: Service Status
        server: my-docker
        container: kuma
        widget:
          type: uptimekuma
          url: https://status.CHANGEME.COM/
          slug: home

    - Dozzle:
        href: https://dozzle.CHANGEME.COM/
        icon: sh-dozzle
