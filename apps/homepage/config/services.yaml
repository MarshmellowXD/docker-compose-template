# Replace CHANGEME.COM with your actual domain before deploying. Homepage does not expand env vars.
- Grand Line:
    - AIOStreams:
        href: https://aiostreams.CHANGEME.COM/
        icon: sh-aiostreams
        description: Stream Aggregator
        server: my-docker
        container: aiostreams

    - Comet:
        href: https://comet.CHANGEME.COM/
        icon: mdi-orbit-#6366f1
        description: Debrid Search
        server: my-docker
        container: comet

    - AIOMetadata:
        href: https://aiometadata.CHANGEME.COM/
        icon: sh-aiostreams
