services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    init: true
    user: "0:0"
    environment:
      TZ: ${TZ}
    expose:
      - 5055
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`${SEERR_HOSTNAME?}`)"
      - "traefik.http.routers.seerr.entrypoints=websecure"
      - "traefik.http.routers.seerr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.seerr.middlewares=tinyauth@docker"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
    volumes:
      - ${DOCKER_DATA_DIR}/seerr:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://127.0.0.1:5055/api/v1/status || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    profiles:
      - seerr
      - arr
      - all
