# docker-compose-template
# Docker Compose stack fronted by Traefik + Tinyauth + Pocket ID
# Domain: ${DOMAIN}
#
# Services are gated by profiles. Use COMPOSE_PROFILES to pick what runs:
#   required    - Core infrastructure (cannot be disabled)
#   streaming   - AIOStreams, AIOMetadata, AIOManager, StremThru, Comet
#   arr         - *arr stack + download clients + Jellyfin/Seerr
#   security    - Vaultwarden
#   photos      - Immich
#   monitoring  - Grafana, Prometheus, Uptime Kuma, etc.
#   productivity - Forgejo, Outline
#   utils       - ntfy, Warp, Technitium
#   all         - Everything

include:
  # Core infrastructure
  - apps/traefik/compose.yaml
  - apps/socket-proxy/compose.yaml
  - apps/cloudflare-ddns/compose.yaml
  - apps/watchtower/compose.yaml
  - apps/gluetun/compose.yaml
  - apps/warp/compose.yaml

  # Media addons
  - apps/aiostreams/compose.yaml
  - apps/aiomanager/compose.yaml
  - apps/aiometadata/compose.yaml
  # - apps/comet/compose.yaml        # Optional debrid search; enable with --profile comet or streaming
  - apps/stremthru/compose.yaml

  # Arr stack
  - apps/qbittorrent/compose.yaml
  - apps/transmission/compose.yaml
  - apps/prowlarr/compose.yaml
  - apps/radarr/compose.yaml
  - apps/sonarr/compose.yaml
  - apps/bazarr/compose.yaml
  - apps/byparr/compose.yaml
  - apps/sabnzbd/compose.yaml
  - apps/jellyfin/compose.yaml
  - apps/seerr/compose.yaml
  - apps/prismarr/compose.yaml
  - apps/qui/compose.yaml

  # Security
  - apps/vaultwarden/compose.yaml

  # Media (photos)
  - apps/immich/compose.yaml

  # Monitoring
  - apps/grafana/compose.yaml
  - apps/prometheus/compose.yaml
  - apps/alertmanager/compose.yaml
  - apps/node-exporter/compose.yaml
  - apps/uptime-kuma/compose.yaml
  - apps/dozzle/compose.yaml
  - apps/homepage/compose.yaml
  - apps/beszel/compose.yaml

  # Productivity & docs
  - apps/forgejo/compose.yaml
  - apps/forgejo-runner/compose.yaml
  - apps/outline/compose.yaml

  # Auth
  - apps/pocket-id/compose.yaml
  - apps/tinyauth/compose.yaml

  # Networking & utilities
  - apps/ntfy/compose.yaml
  - apps/technitium/compose.yaml

networks:
  default:
    name: ${DOCKER_NETWORK:-aio_network}
    external: ${DOCKER_NETWORK_EXTERNAL:-false}
